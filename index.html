$('final').innerHTML=options(unique(all.filter(r=>r.onset===x.onset).map(r=>r.final)),x.final);
$('toneSelect').innerHTML=all.filter(r=>r.onset===x.onset&&r.final===x.final).sort((a,b)=>a.tone-b.tone).map(r=>`<option value="${r.tone}" ${r.tone===tone?'selected':''}>第 ${r.tone} 調</option>`).join('');
$('formula').textContent=`${x.onset||'無聲母'} ＋ ${x.final} ＋ 第 ${tone} 調 → ${x.poj}`;
$('codaHint').textContent=x.coda?`韻母 ${x.final} ＝ 母音 ${x.vowel} ＋ 韻尾 ${x.coda}；入聲短促收尾。`:'選好後按「播放例音」，聽完整音節的真人錄音。';
syncAutoBuilder();
}
function chooseParts(kind,value){stop('已拼好，按「播放例音」聆聽。');const x=data[tone][index],all=Object.values(data).flat();let rows=all.filter(r=>r.onset===(kind==='onset'?value:x.onset));if(kind!=='onset')rows=rows.filter(r=>r.final=== (kind==='final'?value:x.final));const next=rows.find(r=>r.tone===(kind==='tone'?+value:tone))||rows[0];tone=next.tone;index=data[tone].indexOf(next);render();}
$('onset').onchange=e=>chooseParts('onset',e.target.value);$('final').onchange=e=>chooseParts('final',e.target.value);$('toneSelect').onchange=e=>chooseParts('tone',e.target.value);
function render(){requestAnimationFrame(fitListenHeight);renderBuilder(); $('tones').innerHTML=tones.map((t,i)=>`<button class="tone" aria-pressed="${t===tone}" data-tone="${t}"><small>第 ${t} 調</small><b>${symbols[i]}</b></button>`).join('');$('sampleCount').textContent=`本調 ${data[tone].length} 個・共 1,000 個`;$('syllable').textContent=data[tone][index].poj;$('han').textContent=data[tone][index].han;$('sourceLink').href=data[tone][index].sourcePage||data[tone][index].source;renderSamples();}
function sound(x,id){return new Promise((resolve,reject)=>{if(id!==run){resolve();return}const a=new Audio(x.audio);current=a;finishCurrent=()=>{finishCurrent=null;resolve()};a.onended=finishCurrent;a.onerror=()=>{finishCurrent=null;reject(Error('音檔播放失敗，請重試。'))};a.play().catch(reject);})}
async function play(){if($('app').dataset.layout==='tabs')showPage('listen');stop('準備播放…');const id=run;const x=data[tone][index];try{render();$('player').classList.add('playing');$('status').textContent=`正在播放 ${x.poj}`;await sound(x,id);if(id===run){$('player').classList.remove('playing');$('status').textContent='播放完成，再聽一次或換個例音。';}}catch(e){if(id===run){$('status').textContent=e.message||'無法播放，請再按一次。';$('player').classList.remove('playing');}}}
$('tones').onclick=e=>{let b=e.target.closest('[data-tone]');if(b){stop();tone=+b.dataset.tone;index=0;render();play()}};$('samples').onclick=e=>{let b=e.target.closest('[data-index]');if(b){stop();tone=+b.dataset.resultTone;index=+b.dataset.index;render();play()}};$('play').onclick=play;$('stop').onclick=()=>stop();Promise.resolve(JSON.parse(document.getElementById('poj-data').textContent)).then(d=>{data=d;render();$('status').textContent='點選音調或例音，即可聆聽。'}).catch(()=>{$('status').textContent='資料載入失敗，請重新整理。';$('play').disabled=true});

function showPage(page){if(!['build','auto','listen','examples'].includes(page))return;if(page!=='examples'&&document.activeElement?.id==='search')document.activeElement.blur();$('app').dataset.page=page;requestAnimationFrame(fitListenHeight);document.querySelectorAll('[data-page-choice]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.pageChoice===page)));}
$('pageSwitch').onclick=e=>{const b=e.target.closest('[data-page-choice]');if(b)showPage(b.dataset.pageChoice)};
$('builderPlay').onclick=play;
function fitViewport(){const h=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--app-height',`${h}px`);document.documentElement.dataset.compact=String(h<600);$('app').dataset.keyboard=String(h<500&&document.activeElement?.id==='search');}
$('search').addEventListener('focus',fitViewport);$('search').addEventListener('blur',fitViewport);window.addEventListener('resize',fitViewport);window.visualViewport?.addEventListener('resize',fitViewport);fitViewport();

function fitListenHeight(){
if($('app').dataset.page!=='listen')return;
const panel=$('player'),content=panel.querySelector('.voice-display');
const h=content.getBoundingClientRect().height;if(h<=0)return;
const style=getComputedStyle(panel),extra=['paddingTop','paddingBottom','borderTopWidth','borderBottomWidth'].reduce((sum,k)=>sum+(parseFloat(style[k])||0),0);
panel.style.height=`${(h+extra)*1.2825}px`;
}
if(typeof ResizeObserver!=='undefined'){const listenSizeObserver=new ResizeObserver(()=>requestAnimationFrame(fitListenHeight));listenSizeObserver.observe($('player').querySelector('.voice-display'));}
window.addEventListener('resize',()=>requestAnimationFrame(fitListenHeight));

function syncAutoBuilder(){for(const [from,to] of [['onset','autoOnset'],['final','autoFinal'],['toneSelect','autoToneSelect']])$(to).innerHTML=$(from).innerHTML;for(const [from,to] of [['formula','autoFormula'],['codaHint','autoCodaHint']])$(to).textContent=$(from).textContent;}
$('autoOnset').onchange=e=>chooseParts('onset',e.target.value);
$('autoFinal').onchange=e=>chooseParts('final',e.target.value);
$('autoToneSelect').onchange=e=>chooseParts('tone',e.target.value);
$('autoBuilderPlay').onclick=play;
</script></body></html>
